name: Release

on:
  push:
    tags:
      - 'v*'


jobs:
  build-and-release:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      RUSTYMAIL_CLIENT_ID: ${{ secrets.RUSTYMAIL_CLIENT_ID }}
      RUSTYMAIL_CLIENT_SECRET: ${{ secrets.RUSTYMAIL_CLIENT_SECRET }}
      RUSTYMAIL_MICROSOFT_CLIENT_ID: ${{ secrets.RUSTYMAIL_MICROSOFT_CLIENT_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          ssh-key: ${{ secrets.PREMIUM_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      - if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf cmake libvulkan-dev
          # Install LunarG Vulkan SDK for glslc (required by llama.cpp Vulkan builds)
          curl -sL https://sdk.lunarg.com/sdk/download/latest/linux/vulkan-sdk.tar.xz -o /tmp/vulkan-sdk.tar.xz
          sudo mkdir -p /opt/vulkan-sdk
          sudo tar xf /tmp/vulkan-sdk.tar.xz -C /opt/vulkan-sdk --strip-components=1
          echo "VULKAN_SDK=/opt/vulkan-sdk" >> $GITHUB_ENV
          echo "/opt/vulkan-sdk/x86_64/bin" >> $GITHUB_PATH

      - if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Install LunarG Vulkan SDK (required by llama.cpp Vulkan builds)
          $installer = "$env:TEMP\vulkan-sdk.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait
          echo "VULKAN_SDK=C:\VulkanSDK\latest" >> $env:GITHUB_ENV

      - if: contains(matrix.os, 'macos')
        run: |
          brew install cmake
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1

      - run: make install

      - name: Generate Changelog
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" $PREV_TAG..HEAD)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "### Release Notes" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "See the assets to download this version." >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Release ${{ github.ref_name }}
          releaseBody: ${{ env.CHANGELOG }}
          updaterJsonPreferNsis: true
          releaseDraft: false
          prerelease: false
          args: --features ${{ contains(matrix.os, 'macos') && 'premium-metal' || 'premium-vulkan' }}
